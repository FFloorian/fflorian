project:
  type: website
  output-dir: _site

website:
  title: "fflorian.fr"
  favicon: logo.png
  description: "FFlorian — Guides simples et utiles : streaming et DNS. Un site clair, sans pub."
  navbar:
    left:
      - href: index.qmd
        text: Accueil
      - href: articles/guide-streaming.qmd
        text: Streaming
      - href: articles/guide-dns.qmd
        text: DNS
    right:
      - href: https://twitter.com/ffloorian
        text: Twitter
      - href: https://github.com/FFloorian/fflorian
        icon: github
        aria-label: GitHub
  page-footer:
    left: |
      © 2026 FFlorian.
    right: |
      [Code source](https://github.com/FFloorian/fflorian) · [Quarto](https://quarto.org/) · Netlify · Aucune donnée collectée

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom-dark.scss]
    css: styles.css
    include-after-body: after-body.html
    toc: true
    toc-depth: 3
    toc-title: "Sommaire"
    link-external-icon: false
    link-external-newwindow: true
    lang: fr
    grid:
      sidebar-width: 220px
      body-width: 780px
      margin-width: 280px
      gutter-width: 2rem

execute:
  freeze: auto
